name: InTech PR Reviewer
description: >-
  Review the head commit of a pull request on Claude Managed Agents. This job only reads: it leaves a
  validated review in the pr-review-<number> artifact, and the post action (in a job allowed to write)
  posts it. The session clones the repo with this job's read-only GITHUB_TOKEN.
inputs:
  client:
    description: Client name; the agent pr-reviewer-<client> must be deployed to the API key's workspace
    required: true
  anthropic-api-key:
    description: Anthropic API key of the client's workspace
    required: true
  github-token:
    description: Read-only token (contents, pull-requests, checks, statuses). It is handed to the session to clone the repo, so never give it write scopes.
    default: ${{ github.token }}
  shadow:
    description: "true: review and upload the artifact, but the result is 'shadow' so the post job does nothing"
    default: "false"
  budget-usd:
    description: List-cost cap per session, in USD
    default: "15"
  slack-webhook:
    description: Slack incoming webhook; when set, a failed review posts an alert
    default: ""
outputs:
  result:
    description: reviewed | shadow | failed | skipped-fork | skipped-reviewed
    value: ${{ steps.review.outputs.result || steps.event.outputs.result }}
  session-id:
    description: ID of the last Managed Agents session
    value: ${{ steps.review.outputs.session-id }}
  head-sha:
    description: Commit that was reviewed
    value: ${{ steps.review.outputs.head-sha }}
runs:
  using: composite
  steps:
    - id: event
      shell: bash
      env:
        PR: ${{ github.event.pull_request.number }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      run: |
        if [ -z "$PR" ]; then
          echo "::error::The PR reviewer runs on pull_request events only."; exit 1
        fi
        if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
          echo "::notice::PR #$PR comes from a fork ($HEAD_REPO); the reviewer does not run on fork PRs."
          echo "skip=true" >> "$GITHUB_OUTPUT"; echo "result=skipped-fork" >> "$GITHUB_OUTPUT"
        fi
    - if: steps.event.outputs.skip != 'true'
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - if: steps.event.outputs.skip != 'true'
      shell: bash
      run: python -m pip install --quiet --disable-pip-version-check "$GITHUB_ACTION_PATH"
    - id: review
      if: steps.event.outputs.skip != 'true'
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        CLIENT: ${{ inputs.client }}
        PR: ${{ github.event.pull_request.number }}
        BUDGET: ${{ inputs.budget-usd }}
        SHADOW: ${{ inputs.shadow }}
      run: |
        pr-reviewer review --client "$CLIENT" --pr "$PR" --budget-usd "$BUDGET" \
          --out "$RUNNER_TEMP/pr-review-out" --session-file "$RUNNER_TEMP/pr-reviewer-session" \
          $([ "$SHADOW" = "true" ] && echo --shadow)
    - if: always() && steps.event.outputs.skip != 'true'
      uses: actions/upload-artifact@v4
      with:
        name: pr-review-${{ github.event.pull_request.number }}
        path: ${{ runner.temp }}/pr-review-out
        if-no-files-found: ignore
        overwrite: true
        retention-days: 14
    - name: Interrupt the session of a cancelled run
      if: cancelled() && steps.event.outputs.skip != 'true'
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
      run: |
        if [ -s "$RUNNER_TEMP/pr-reviewer-session" ]; then
          pr-reviewer interrupt --session-file "$RUNNER_TEMP/pr-reviewer-session"
        fi
    - name: Alert Slack
      if: failure() && inputs.slack-webhook != ''
      shell: bash
      env:
        SLACK_WEBHOOK: ${{ inputs.slack-webhook }}
        MSG: "PR Reviewer failed on ${{ github.repository }}#${{ github.event.pull_request.number }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      run: |
        python3 -c 'import json, os; print(json.dumps({"text": os.environ["MSG"]}))' |
          curl -sS -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK"
