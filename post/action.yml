name: InTech PR Reviewer - post
description: >-
  Post the review left by the InTech PR Reviewer action as a COMMENT review, after validating it again.
  Run it in a separate job with pull-requests write, so the review session never sees a write token.
  Posts nothing when a bot review for the same head commit already exists. Each repo can also let the
  reviewer give a +1 (approve: true).
inputs:
  github-token:
    description: Token allowed to write pull request reviews
    default: ${{ github.token }}
  approve:
    description: >-
      "true": also approve the PR when the review scores at least approve-min-score with no Required
      findings. Only the current head commit is approved, and only when a ruleset on the base branch
      dismisses approvals on push. Off by default; each repo opts in.
    default: "false"
  approve-min-score:
    description: Lowest quality score (0-100) that gets the +1
    default: "100"
  approve-token:
    description: >-
      Token that gives the +1 (default: github-token). For the +1 to count where code-owner review is
      required, use a token of an account in the code-owner team. github-actions[bot] is never a code
      owner, and it can approve only when the repo lets GitHub Actions approve pull requests.
    default: ""
  slack-webhook:
    description: Slack incoming webhook; when set, a failed post sends an alert
    default: ""
outputs:
  result:
    description: posted | skipped-reviewed
    value: ${{ steps.post.outputs.result }}
  approved:
    description: true | false when approve is on, else empty
    value: ${{ steps.post.outputs.approved }}
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      with:
        name: pr-review-${{ github.event.pull_request.number }}
        path: ${{ runner.temp }}/pr-review-out
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - shell: bash
      run: python -m pip install --quiet --disable-pip-version-check "$GITHUB_ACTION_PATH/.."
    - id: post
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        APPROVE_TOKEN: ${{ inputs.approve-token }}
        APPROVE: ${{ inputs.approve }}
        APPROVE_MIN_SCORE: ${{ inputs.approve-min-score }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        pr-reviewer post --pr "$PR" --dir "$RUNNER_TEMP/pr-review-out" \
          $([ "$APPROVE" = "true" ] && echo --approve-min-score "$APPROVE_MIN_SCORE")
    - name: Alert Slack
      if: failure() && inputs.slack-webhook != ''
      shell: bash
      env:
        SLACK_WEBHOOK: ${{ inputs.slack-webhook }}
        MSG: "PR Reviewer could not post on ${{ github.repository }}#${{ github.event.pull_request.number }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      run: |
        python3 -c 'import json, os; print(json.dumps({"text": os.environ["MSG"]}))' |
          curl -sS -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK"
